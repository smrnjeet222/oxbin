# fly.toml app configuration file generated for oxbin on 2026-06-16T12:29:39+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oxbin'
primary_region = 'sin'

[build]
  [build.args]
    GO_VERSION = '1.24.5'

[env]
  PORT = '8080'
  OXBIN_WEBAPP_URL = 'https://oxbin.jeet22.xyz/blob/'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
